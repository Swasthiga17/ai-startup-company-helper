services:
  - type: web
    name: ideaexecutor
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.app:socket_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: chroma-data
      mountPath: /app/chroma_db
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CHROMA_PATH
        value: /app/chroma_db
      - key: CORS_ORIGINS
        value: https://ideaexecutor.onrender.com,https://buildyourowncompanyusingaibss.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: ideaexecutor-db
          property: connectionString

databases:
  - name: ideaexecutor-db
    databaseName: startupdb
    user: startupuser
